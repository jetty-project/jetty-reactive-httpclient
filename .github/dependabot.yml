version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 50
    target-branch: "4.0.x"
    commit-message:
      prefix: "[4.0.x] "
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "org.eclipse.jetty:*"
        versions: [ ">=12.1.0" ]
      - dependency-name: "org.springframework:*"
        versions: [ ">=7.0.0" ]

  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 50
    target-branch: "4.1.x"
    commit-message:
      prefix: "[4.1.x] "
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "org.eclipse.jetty:*"
        versions: [ ">=12.2.0" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
